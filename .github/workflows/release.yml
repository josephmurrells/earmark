name: Release

# Pushing a `v*` tag on master builds, packages and opens a draft release,
# which is published by hand after a check.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Check the tag
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          $version = ($metadata.packages | Where-Object name -eq 'earmark').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the earmark version $version"
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on master" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-about@0.9.2
      - run: ./release/package.ps1 -Version ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # GitHub only supports build attestations in private repos on Enterprise
      # plans, so attest once the repo is public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.zip
            dist/Earmark-*-windows-x64/earmark.exe
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = "true" ]; then
            VERIFY="compare it with \`SHA256SUMS.txt\`."
          else
            VERIFY="compare it with \`SHA256SUMS.txt\`, or run \`gh attestation verify Earmark-${VERSION}-windows-x64.zip -R ${GITHUB_REPOSITORY}\`."
          fi
          cat > notes.md <<EOF
          Download \`Earmark-${VERSION}-windows-x64.zip\`, extract it anywhere and run \`earmark.exe\`. See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md) to get started.

          - **Not a medical test:** Earmark tunes how your headphones sound to you; it can't diagnose hearing loss.
          - **Not code-signed yet:** Windows SmartScreen may warn about an "unknown publisher" the first time you run it.
          - **Check a download:** ${VERIFY}
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Earmark $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            dist/*.zip dist/SHA256SUMS.txt
