# Settings for `cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html`,
# which lists the licences of every crate built into earmark.exe.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "CC0-1.0",
    "Ubuntu-font-1.0",
]
