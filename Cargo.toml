[package]
name = "earmark"
version = "0.1.0"
edition = "2024"
description = "A personal headphone EQ built from a quick hearing test."
license = "MIT OR Apache-2.0"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
fastrand = "2.5.0"
raw-window-handle = "0.6"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
hound = "3.5.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
# Line numbers in crash-log backtraces (kept in the separate .pdb file).
debug = "line-tables-only"
